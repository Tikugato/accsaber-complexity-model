name: Build, publish and deploy

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'training/**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick the image tag for this branch
        id: target
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "tag=develop" >> "$GITHUB_OUTPUT"
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi
          echo "image=ghcr.io/${owner}/accsaber-complexity-model" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.target.outputs.image }}:${{ steps.target.outputs.tag }}
            ${{ steps.target.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy the backend stack through Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_UUID: ${{ steps.target.outputs.environment == 'prod' && secrets.COOLIFY_PROD_UUID || secrets.COOLIFY_STAGING_UUID }}
        run: |
          : "${COOLIFY_URL:?is empty, ${{ steps.target.outputs.environment }} was not redeployed}"
          : "${COOLIFY_TOKEN:?is empty, ${{ steps.target.outputs.environment }} was not redeployed}"
          : "${COOLIFY_UUID:?is empty, ${{ steps.target.outputs.environment }} was not redeployed}"
          curl --fail-with-body -sS -X GET \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_UUID}&force=false"
