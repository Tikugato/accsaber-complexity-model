[project]
name = "accsaber-complexity-model"
version = "0.1.0"
description = "Per-note accuracy model behind the AccSaber complexity script"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["complexity_model"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
